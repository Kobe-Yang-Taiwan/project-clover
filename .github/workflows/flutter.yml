name: Flutter checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org tw.projectclover --project-name project_clover --no-pub .

      - name: Configure Android notifications
        run: python3 tool/configure_android_notifications.py

      - name: Install dependencies
        run: flutter pub get

      - name: Record resolved dependencies
        run: cat pubspec.lock

      - name: Test Gemini proxy privacy and schema boundary
        run: node --test proxy/test/*.test.mjs

      - name: Verify provider secret boundary
        run: python3 tool/verify_cloud_secret_boundary.py

      - name: Check formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: project-clover-build-20-critical-draft-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify local capture persistence and pending Android notification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tool/run_android_capture_smoke.py

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-clover-build-20-device-evidence
          path: |
            build/device-smoke.log
            build/device-alarm.txt
            build/device-saved.png
          if-no-files-found: ignore
          retention-days: 14
