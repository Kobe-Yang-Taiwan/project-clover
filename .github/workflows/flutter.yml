name: Flutter checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org tw.projectclover --project-name project_clover --no-pub .

      - name: Configure Android notifications
        run: python3 tool/configure_android_notifications.py

      - name: Install dependencies
        run: flutter pub get

      - name: Test Gemini proxy privacy and schema boundary
        run: node --test proxy/test/*.test.mjs

      - name: Verify provider secret boundary
        run: python3 tool/verify_cloud_secret_boundary.py

      - name: Check formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: project-clover-build-20-critical-draft-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
